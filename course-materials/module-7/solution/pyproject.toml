[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pricecheck"
version = "0.1.0"
description = "Bounded-concurrency, chunked price checker"
requires-python = ">=3.11"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/pricecheck"]

[tool.mypy]
strict = true
