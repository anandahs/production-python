[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signupflow"
version = "0.1.0"
description = "Signup record validation and reporting"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.9.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/signupflow"]

[tool.mypy]
strict = true