[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notifier"
version = "0.1.0"
description = "Order confirmation notifier with structured, diagnosable logging"
requires-python = ">=3.11"
dependencies = [
    "structlog==26.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/notifier"]

[tool.mypy]
strict = true
